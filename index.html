<style>

:root[data-theme="dark"]{--bg:#121212;--bar:#000;--card:#1e1e1e;--ink:#eee;--mute:#999;--line:#333;--accent:#f2f2f2;--accent-t:#111;--field:#262626}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-t);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px}
.bar h1{font:800 17px Bitter,Georgia,serif;margin:0 auto 0 0}
.seg{display:flex;border:1px solid #666;border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--bar-t);padding:7px 12px;font:inherit;cursor:pointer}
.seg button.on{background:#f2f2f2;color:#111;font-weight:600}
.btn{background:#f2f2f2;color:#111;border:0;border-radius:6px;padding:8px 13px;font:600 14px "Public Sans",system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:none;color:inherit;border:1px solid currentColor}

.btn:disabled{opacity:.5}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #2d6cdf;outline-offset:1px}

.opts .ck{display:flex;align-items:center;gap:8px;padding-top:18px;color:var(--ink);font-size:14px}.opts .ck input{width:auto}
.sheet{background:#fff;color:#000;font:15px/1.35 Tinos,"Times New Roman",serif;padding:22px 26px;border:1px solid var(--line);margin:0 auto}
.sheet input,.sheet textarea{font:inherit;color:#000;background:none;border:0;border-bottom:1px dotted #bbb;border-radius:0;padding:2px 3px;width:100%}
.sheet textarea{resize:none;overflow:hidden;display:block}
.sheet .v{font:inherit;color:#000;white-space:pre-wrap;min-height:1.3em}
.top{text-align:right;font-weight:700;font-size:14px}
.top input,.top .v{text-align:right;font-weight:700}
.lh{text-align:center}
.lh input,.lh .v{text-align:center;font-weight:700;font-size:15px}
.lh .nm{font:800 38px/1.15 Bitter,Georgia,serif}
.rule{border:0;border-top:1.5px solid #000;margin:6px 0 8px}

.refrow input[type=date],.refrow .v[data-t=date]{width:190px;border-bottom:1.5px dotted #000}
.vrow{display:flex;justify-content:flex-end;font-size:14px;margin-top:2px}.vrow label{display:flex;gap:4px;align-items:center}.vrow input{width:170px}
.to{margin-top:12px;font-size:16px}
.cn,.ca{font-weight:700;text-transform:uppercase;font-size:16px}
.opt{font-size:14px}
.dt{text-align:center;font:700 19px Tinos,serif;text-decoration:underline;margin:14px 0 8px;text-transform:uppercase}
.tw{overflow-x:auto}
.bt{width:100%;min-width:640px;border-collapse:collapse;border:1px solid #000;font-size:14px}
.bt th{border:1px solid #000;padding:4px;text-align:center;font-weight:700}
.bt td{border-left:1px solid #000;border-right:1px solid #000;padding:3px 4px;vertical-align:top}
.bt td.c{text-align:center}.bt td.n{text-align:right;white-space:nowrap}
.bt tr.fill td{height:30px}
.bt textarea,.bt td .v:not([data-t=number]){text-align:justify}
.bt input[type=number],.bt td .v[data-t=number]{text-align:right}
.qu{display:flex;gap:3px;justify-content:center}.qu input:first-child{width:50px;flex:none}.qu input:last-child{flex:1;min-width:0;text-align:left}
.qu .v{width:auto}
.x{background:none;border:0;color:#999;cursor:pointer;font-size:18px}
.tt{width:46%;margin-left:auto;border-collapse:collapse;font-size:14px;font-weight:700}
.tt td{border:1px solid #000;padding:3px 8px}.tt td:last-child{text-align:right;width:40%}
.wd{border:1px solid #000;border-top:0;padding:3px 6px;font-weight:700;font-size:14px}
@media(max-width:620px){main{padding:0 8px;margin:8px auto}.bar{position:static;padding:8px 10px;gap:6px}.bar h1{flex:1 1 100%;font-size:15px}.seg{flex:1 1 100%}.seg button{flex:1;padding:10px 4px}.bar>.btn{flex:1 1 22%;padding:10px 4px;font-size:13px}#pdf{order:1;flex:1 1 100%!important;font-size:15px!important}.tools .btn{flex:1 1 45%;min-height:42px}#scan{flex:1 1 100%}.opts{grid-template-columns:1fr 1fr}.sheet{padding:12px}.sheet input,.sheet textarea,.opts input,.opts select{font-size:16px}.lh input{font-size:13px}.top input{font-size:14px}.lh .nm{font-size:clamp(17px,5.4vw,24px)}.tt{width:100%}.refrow{flex-direction:column;gap:4px}.refrow input,.refrow label:first-child input{width:100%!important}.refrow label{flex:1}.row{flex-wrap:wrap}.tw{overflow:visible}.bt{min-width:0;border:0}.bt thead{display:none}.bt tbody,.bt td{display:block}.bt tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 8px;border:1px solid #000;margin-bottom:8px;padding:8px;position:relative}.bt td{border:0!important;padding:0!important}.bt td:nth-child(1),.bt td:nth-child(2){grid-column:1/4}.bt td:nth-child(1){font-weight:700;text-align:left}.bt td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:#666;font-weight:400}.bt td.noprint{position:absolute;top:2px;right:6px}.bt td.noprint .x{font-size:22px;padding:4px 8px}.bt tr.fill{display:none}.qu input:first-child{width:56px}}
.sheet.est .lh input,.sheet.est .lh .v,.sheet.est .top input,.sheet.est .top .v,.sheet.est .dt,.sheet.est .bt th{color:#9f3626}
.saved{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px}
.saved h3{margin:0 0 8px;font:800 16px Bitter,Georgia,serif}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding:7px 0}
.row span{color:var(--mute);font-size:13px}
@page{size:A4 portrait;margin:10mm}
@media print{body{background:#fff}body::before,.bar,.tools,.opts,.saved,.noprint,#scanmsg{display:none!important}main{margin:0;max-width:none;padding:0}.sheet{border:0;padding:0}.sheet input,.sheet textarea{border:0!important}.refrow input[type=date]{border-bottom:1.5px dotted #000!important}.refrow input[type=date]::-webkit-calendar-picker-indicator{display:none}.tw{overflow:visible}.bt{min-width:0}.bt tr.fill td{height:300px}}
#print{display:none!important}
</style>
</head>
<body>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pre={Quotation:'QT',Estimate:'EST',Invoice:'INV'},ttl={Quotation:'Quotation',Estimate:'Estimate',Invoice:'Tax Invoice'};
let type='Quotation',items=[],cur=null;
const fmt=n=>(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function inr(n){const r=Math.floor(n+1e-9),p=Math.round((n-r)*100),a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const t=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:''),h=x=>(x>99?a[Math.floor(x/100)]+' hundred'+(x%100?' ':''):'')+(x%100?t(x%100):'');
let s='',m=r;[[1e7,'crore'],[1e5,'lakh'],[1e3,'thousand']].forEach(([v,w])=>{if(m>=v){s+=h(Math.floor(m/v))+' '+w+' ';m%=v}});s+=m?h(m):'';if(!r)s='Zero';
return 'GRAND TOTAL IN WORDS: - INR '+s.trim()+' and '+(p?t(p):'Zero')+' Paise only.'}
function nextNum(){const c=store.get('vk_count_'+type,0)+1;return pre[type]+'/'+new Date().getFullYear()+'/'+String(c).padStart(3,'0')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function size(){document.querySelectorAll('.sheet textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})}
function render(){
 $('rows').innerHTML=items.map((it,i)=>`<tr><td class="c">${i+1}.</td><td data-l="Description"><textarea rows="1" data-i="${i}" data-k="d">${esc(it.d)}</textarea></td><td data-l="Qty"><div class="qu"><input type="number" min="0" step="any" data-i="${i}" data-k="q" value="${it.q}"><input data-i="${i}" data-k="u" value="${esc(it.u)}" aria-label="Unit"></div></td><td data-l="Rate"><input id="r${i}" type="number" min="0" step="any" data-i="${i}" data-k="r" value="${it.r}"></td><td data-l="Amount"><input id="a${i}" type="number" min="0" step="any" data-i="${i}" data-k="a"></td><td class="noprint"><button class="x" data-del="${i}" aria-label="Remove item">×</button></td></tr>`).join('')+'<tr class="fill"><td></td><td></td><td></td><td></td><td></td><td class="noprint" style="border:0"></td></tr>';
 calc();size()}
function calc(){
 const est=type==='Estimate',g=est?0:(+$('gst').value||0),d=+$('disc').value||0,tr=+$('trans').value||0,ad=+$('adv').value||0,inc=$('incl').checked,mode=$('gtype').value;let T=0;
 items.forEach((it,i)=>{const gross=it.q*it.r;T+=inc?gross/(1+g/100):gross;
  const e=$('a'+i);if(e&&document.activeElement!==e)e.value=gross?gross.toFixed(2):'';
  });
 const dd=inc?d/(1+g/100):d,base=Math.max(T-dd,0),gt=base*g/100,tot=base+gt+tr,sh=(id,on,v)=>{$(id).style.display=on?'':'none';if(on&&v!=null)$('v'+id.slice(1)).textContent=v};
 $('tv').textContent=fmt(T);$('ltv').textContent=est?'Sub Total':'Total Taxable Value';$('rtv').style.display=est&&!(d>0||tr>0)?'none':'';$('rg1').style.display=est?'none':'';sh('rd',d>0);$('vd').textContent=fmt(dd);
 $('l1').textContent=(mode==='in'?'CGST@'+g/2:mode==='out'?'IGST@'+g:'GST@'+g)+'%';$('v1').textContent=fmt(mode==='in'?gt/2:gt);
 $('rg2').style.display=mode==='in'&&!est?'':'none';$('l2').textContent='SGST@'+g/2+'%';$('v2').textContent=fmt(gt/2);
 $('rt').style.display=tr>0?'':'none';$('vt').textContent=fmt(tr);
 $('grand').textContent=fmt(tot);$('ra').style.display=ad>0?'':'none';$('va').textContent=fmt(ad);$('rb').style.display=ad>0?'':'none';$('bal').textContent=fmt(tot-ad);
 $('words').textContent=inr(tot)}
function setType(t){type=t;document.querySelectorAll('#type button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 $('title').textContent=ttl[t];if(!cur)$('num').value=nextNum();if(!cur&&t==='Quotation')$('incl').checked=true;$('sheet').classList.toggle('est',t==='Estimate');document.querySelectorAll('.gstopt').forEach(e=>e.style.display=t==='Estimate'?'none':'');if($('rows').firstChild)calc()}
function fresh(){cur=null;items=[{d:'',u:'nos',q:1,r:0}];['cname','caddr','cphone','cgst','ref'].forEach(i=>$(i).value='');pick(0);$('cpick').value='0';
 $('disc').value=0;$('trans').value=0;$('adv').value=0;$('gst').value=18;$('incl').checked=false;$('gtype').value='one';
 $('date').valueAsDate=new Date();setType(type);render()}
const FK=['sname','saddr','sphone','sgst','semail','cname','caddr','cphone','cgst','ref','disc','gst','trans','adv','gtype'];
function snap(){return{id:cur||Date.now(),type,inc:$('incl').checked,num:$('num').value,date:$('date').value,items,f:Object.fromEntries(FK.map(k=>[k,$(k).value]))}}
function load(d){cur=d.id;type=d.type;items=d.items;Object.entries(d.f).forEach(([k,v])=>{const e=$(k);if(e)e.value=v});$('incl').checked=!!d.inc;$('cpick').value='';$('num').value=d.num;$('date').value=d.date;setType(d.type);render();scrollTo(0,0)}
function list(){const all=store.get('vk_docs',[]);$('list').innerHTML=all.length?all.map(d=>`<div class="row"><div><b>${esc(d.num)}</b> <span>${esc(d.type)} · ${esc(d.f.cname||'No name')} · ${d.date}</span></div><div><button class="btn ghost" data-open="${d.id}">Open</button> <button class="btn ghost" data-rm="${d.id}">Delete</button></div></div>`).join(''):'<span style="color:var(--mute)">Nothing saved yet. Fill in a document and press Save.</span>'}
$('type').onclick=e=>{const t=e.target.dataset.t;if(t)setType(t)};
$('rows').addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(i==null)return;const k=t.dataset.k,it=items[i];
 if(k==='a'){const v=+t.value||0;it.r=it.q?v/it.q:0;$('r'+i).value=it.r?+it.r.toFixed(4):''}
 else it[k]=(k==='q'||k==='r')?(+t.value||0):t.value;calc()});
$('rows').addEventListener('click',e=>{const i=e.target.dataset.del;if(i!=null){items.splice(i,1);if(!items.length)items.push({d:'',u:'nos',q:1,r:0});render()}});
['gst','incl','gtype','disc','trans','adv'].forEach(i=>{$(i).oninput=calc;$(i).onchange=calc});
$('add').onclick=()=>{items.push({d:'',u:'nos',q:1,r:0});render()};
$('sample').onclick=()=>{items=[{d:'Hardwood bench 180×30×45 cm, plank leg',u:'nos',q:80,r:1900},{d:'Hardwood desk 180×42.5×75 cm',u:'nos',q:80,r:2500},{d:'Hardwood junior officer’s table 120×75×75 cm, one drawer and one cupboard',u:'nos',q:25,r:7500},{d:'Hardwood arm chair, plank seat',u:'nos',q:28,r:2100}];render()};
$('new').onclick=fresh;
$('print').onclick=()=>{const t=document.title;document.title=(($('num').value||'document')+' '+($('cname').value||'')).trim().replace(/[\/\\:*?"<>|]/g,'-');print();setTimeout(()=>document.title=t,500)};
$('theme').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#121212';r.dataset.theme=d?'light':'dark';store.set('vk_theme',r.dataset.theme)};
$('save').onclick=()=>{const all=store.get('vk_docs',[]),d=snap(),i=all.findIndex(x=>x.id===d.id);
 if(i>=0)all[i]=d;else{all.unshift(d);store.set('vk_count_'+type,store.get('vk_count_'+type,0)+1)}
 cur=d.id;store.set('vk_docs',all);store.set('vk_seller3',Object.fromEntries(['sname','saddr','sphone','sgst','semail'].map(k=>[k,$(k).value])));list();$('save').textContent='Saved';setTimeout(()=>$('save').textContent='Save',1200)};
$('list').onclick=e=>{const o=e.target.dataset.open,r=e.target.dataset.rm,all=store.get('vk_docs',[]);
 if(o){const d=all.find(x=>String(x.id)===o);if(d)load(d)}
 if(r&&confirm('Delete this saved document?')){store.set('vk_docs',all.filter(x=>String(x.id)!==r));list()}};
document.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'){e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'}});
const th=store.get('vk_theme',null);if(th)document.documentElement.dataset.theme=th;
const sl=store.get('vk_seller3',null);if(sl)Object.entries(sl).forEach(([k,v])=>$(k).value=v);
const PDFCSS='html,body{margin:0;background:#fff;width:794px}body{padding:0!important}body::before{display:none}.sheet{width:794px;max-width:none;border:0;padding:34px 40px 0;margin:0}.tw{overflow:visible}.bt{min-width:0}';
async function savePdf(name,blob){
 const C=window.Capacitor;
 if(C&&C.isNativePlatform&&C.isNativePlatform()){
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Could not read the PDF'));r.readAsDataURL(blob)});

function shrink(file,max=1800){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('Could not read the image'));fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('Could not open the image'));img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Could not prepare the image')),'image/jpeg',.88)};img.src=fr.result};fr.readAsDataURL(file)})}
const SCANPROMPT='The attached image is a photo of a handwritten rough bill or quotation from a wood furniture workshop in Kerala, India. Read it carefully and return ONLY JSON in this shape: {"customer": string or null, "items": [{"description": string, "unit": string, "qty": number, "rate": number, "amount": number}], "written_total": number or null}. Rules: one item per work or line; keep sizes such as 180x30x45 in the description; expand HW to Hardwood, AW to Anjili wood and TW to Teak wood; the unit defaults to nos; a line like "80 nos x 1900 = 152000" means qty 80, rate 1900, amount 152000; ignore running sums and put the grand total only in written_total; if only qty and amount are given, still return both and leave rate 0; if a number is unreadable use 0; never invent items.';
$('scan').onclick=()=>$('scanfile').click();
$('scanfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!smp)return;
 const m=$('scanmsg'),b=$('scan');m.textContent='Reading the handwriting…';b.disabled=true;
 try{
  const blob=await shrink(f);
  const data=await smp.json(SCANPROMPT,{images:blob,cache:false,modelTier:'default'});
  const list=(data&&data.items)||[];if(!list.length)throw new Error('No items found in the image');
  type='Estimate';fresh();
  items=list.map(i=>{let q=+i.qty||0,r=+i.rate||0;const a=+i.amount||0;if(!r&&q&&a)r=a/q;if(!q&&r&&a)q=a/r;return{d:String(i.description||''),u:String(i.unit||'nos'),q:q||1,r:r||0}});
  if(data.customer){$('cname').value=data.customer;$('caddr').value='';$('cpick').value=''}

  const sum=items.reduce((s,i)=>s+i.q*i.r,0);let msg='Filled '+items.length+' items as an estimate. Check every line against the paper, because handwriting can be misread.';
  if(data.written_total&&Math.abs(data.written_total-sum)>1)msg+=' The total written on the note ('+fmt(data.written_total)+') differs from the items total ('+fmt(sum)+').';
  m.textContent=msg;
 }catch(err){m.textContent=err&&err.code==='not_granted'?'Permission to use AI was not given.':'Could not read the bill: '+((err&&err.message)||err)}
 finally{b.disabled=false}
};
